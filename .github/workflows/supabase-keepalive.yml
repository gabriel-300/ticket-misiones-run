name: Supabase Keep Alive

on:
  schedule:
    - cron: '0 9 */3 * *'   # Cada 3 días a las 9am UTC (evita el pausa de 7 días)
  workflow_dispatch:          # Permite ejecutarlo manualmente desde GitHub

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping Supabase
        run: |
          STATUS=$(curl -s -o /dev/null -w "%{http_code}" \
            -H "apikey: ${{ secrets.SUPABASE_ANON_KEY }}" \
            -H "Authorization: Bearer ${{ secrets.SUPABASE_ANON_KEY }}" \
            "${{ secrets.SUPABASE_URL }}/rest/v1/events?select=id&limit=1")
          echo "Supabase ping status: $STATUS"
          if [ "$STATUS" != "200" ]; then
            echo "Error: respuesta inesperada ($STATUS)"
            exit 1
          fi
          echo "OK — proyecto activo"
